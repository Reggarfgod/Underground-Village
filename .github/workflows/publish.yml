name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: "1.21.1-fabric"
            mc_version: "1.21.1"
            game_versions: |
              1.21
              1.21.1
            loader: "fabric"
            loader_name: "Fabric"
            java: 21
          - project: "1.21.1-neoforge"
            mc_version: "1.21.1"
            game_versions: |
              1.21
              1.21.1
            loader: "neoforge"
            loader_name: "NeoForge"
            java: 21
          - project: "26.1-fabric"
            mc_version: "26.1"
            game_versions: "26.1"
            loader: "fabric"
            loader_name: "Fabric"
            java: 25
          - project: "26.1-neoforge"
            mc_version: "26.1"
            game_versions: "26.1"
            loader: "neoforge"
            loader_name: "NeoForge"
            java: 25
          - project: "26.3-fabric"
            mc_version: "26.3"
            game_versions: "26.3"
            loader: "fabric"
            loader_name: "Fabric"
            java: 25
          - project: "26.3-neoforge"
            mc_version: "26.3"
            game_versions: "26.3"
            loader: "neoforge"
            loader_name: "NeoForge"
            java: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine mod version
        id: mod_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -E "^mod\.version\s*=" stonecutter.properties.toml | cut -d'"' -f2 | tr -d '[:space:]')
            TAG="v${VERSION}"
          fi
          CLEAN_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${CLEAN_VERSION} (Tag: ${TAG})"

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build :${{ matrix.project }}
        run: |
          # Strip local developer Java home path if present
          if [ -f "gradle.properties" ]; then
            sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          fi

          ./gradlew :${{ matrix.project }}:build -x test --no-daemon

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || 'underground-villages-stoneholm' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || 'underground-villages-stoneholm' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: versions/${{ matrix.project }}/build/libs/!(*-@(sources|dev)).jar
          game-versions: ${{ matrix.game_versions }}
          loaders: ${{ matrix.loader }}
          version: ${{ steps.mod_info.outputs.tag }}+${{ matrix.project }}
          name: Underground Village ${{ steps.mod_info.outputs.version }} for ${{ matrix.mc_version }} (${{ matrix.loader_name }})
          changelog-file: Changelog.md
